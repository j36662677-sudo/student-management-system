<!DOCTYPE html>
<html>
<head>
    <title>Add Mark</title>
</head>

<body>

<h1>📊 Add Mark</h1>

<form method="POST">

    {% csrf_token %}

    <label>Student:</label>
    <select name="student" required>
        <option value="">Select Student</option>

        {% for student in students %}
            <option value="{{ student.id }}">
                {{ student.student_id }} - {{ student.name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Subject:</label>
    <select name="subject" required>
        <option value="">Select Subject</option>

        {% for subject in subjects %}
            <option value="{{ subject.id }}">
                {{ subject.subject_code }} - {{ subject.name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Internal Mark:</label>
    <input type="number" name="internal_mark" min="0" max="40" required>

    <br><br>

    <label>Exam Mark:</label>
    <input type="number" name="exam_mark" min="0" max="60" required>

    <br><br>

    <button type="submit">➕ Add Mark</button>

</form>

<br>

<a href="/marks/">← Back to Marks</a>

</body>
</html>
