<!DOCTYPE html>
<html>

<head>
    <title>Edit Department</title>
</head>

<body>

<h1>✏️ Edit Department</h1>

<form method="POST">

    {% csrf_token %}

    <label>Department Name:</label>
    <input type="text"
           name="name"
           value="{{ department.name }}"
           required>

    <br><br>

    <label>Department Code:</label>
    <input type="text"
           name="code"
           value="{{ department.code }}"
           required>

    <br><br>

    <button type="submit">💾 Save Changes</button>

</form>

<br>

<a href="/students/departments/">← Back to Departments</a>

</body>

</html>
