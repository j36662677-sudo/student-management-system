<!DOCTYPE html>
<html>
<head>

    <title>Login - Student Management System</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.15);

            text-align: center;
        }

        .login-box h1 {
            color: #23428c;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group input:focus {
            border-color: #23428c;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;

            background: #23428c;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1b3475;
        }

        .error {
            background: #ffe5e5;
            color: #c62828;

            padding: 10px;
            border-radius: 6px;

            margin-bottom: 20px;
        }

        .logo {
            font-size: 45px;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">🎓</div>

        <h1>Student Management System</h1>

        <p>Login to your account</p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button type="submit" class="login-btn">
                🔐 Login
            </button>

        </form>

    </div>

</body>
</html>
